<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<!-- bootstrap min css -->
		<link rel="stylesheet" href="assets/css/bootstrap.min.css">
		<!-- overlay scrollbars css -->
		<link rel="stylesheet" href="assets/css/overlayscrollbars.min.css">
		<!-- magnific popup min css -->
		<link rel="stylesheet" href="assets/css/magnific-popup.css">
		<!-- nice select css -->
		<link rel="stylesheet" href="assets/css/nice-select.css">
		<!-- fonts -->
		<link rel="stylesheet" href="https://use.typekit.net/ioe6vqa.css">
		<!-- style css -->
		<link rel="stylesheet" href="assets/css/main.css">
		<!-- responsive css -->
		<link rel="stylesheet" href="assets/css/responsive.css">
		<title>freez construction</title>
	</head>
	<body data-overlayscrollbars-initialize>
		<!-- header section start -->
		<header class="header-area login-header">
			<div class="container position-relative z-3">
				<a href="#" class="header-logo text-center">
				<img src="assets/images/header-logo/logo.svg" alt="...">
				</a>
				<div class="right-button-wrapper d-flex align-items-center justify-content-end">
					<select name="cars" id="cars">
						<option value="volvo">English</option>
						<option value="saab">Saab</option>
						<option value="mercedes">Mercedes</option>
						<option value="audi">Audi</option>
					</select>
				</div>
			</div>
		</header>
		<!-- header section end -->
		<div class="header-fix"></div>
		<!-- main section start -->

		<main>
			<!-- login section start -->

			<div class="login-wrapper position-relative z-1">
				<div class="login-bg bg-fix" style="background-image: url('assets/images/video-wrapper/video-img.jpg');"></div>
				<div class="div-info position-relative z-1"></div>
				<div class="container">
					<div class="contact-wrapper">
						<h2 class="title-info">Training Login</h2>
						<form>
							<div class="contact-info">
							  <label for="exampleInputEmail1">Email / Username  </label>
							  <input type="email" id="exampleInputEmail1" aria-describedby="emailHelp">
							</div>
							<div class="contact-info">
							  <label for="text">Password</label>
							  <input type="text" id="text" aria-describedby="text">
							</div>
							<div class="login-button-wrapper d-flex align-items-center justify-content-between gap-2">
								<a href="#" class="forgot-credentials">Forgot your credentials?</a>
								<button type="submit" class="btn-1 border-0">Submit</button>
							</div>
							
						  </form>
					</div>
				</div>
			</div>
			<!-- login section start -->
		</main>
		<!-- main section end -->
		<!-- footer section start -->
		<!-- footer section end -->
		<!-- jquery min js -->
		<script src="assets/js/jquery.min.js"></script>
		<!-- bootstrap min js -->
		<script src="assets/js/bootstrap.bundle.min.js"></script>
		<!-- magnific popup min js -->
		<script src="assets/js/magnific-popup.min.js"></script>
		<!-- nice select min js -->
		<script src="assets/js/nice-select.min.js"></script>
		<!-- scrollTrigger min js -->
		<script src="assets/js/scrollTrigger.min.js"></script>
		<!-- gsap split min js -->
		<script src="assets/js/gsap-split-text.js"></script>
		<!-- gsap min js -->
		<script src="assets/js/gsap.min.js"></script>
		<!-- lenis min js -->
		<script src="assets/js/lenis.min.js"></script>
		<!-- overlay scrollbar min js -->
		<script src="assets/js/overlayscrollbars.min.js"></script>
		<!-- main js -->
		<script src="assets/js/main.js"></script>
	</body>
</html>
